plugins {
    id "com.android.application"
}

// En local : keystore.properties ignoré par Git. En CI : variables d'environnement
// (la clé est décodée temporairement par le workflow GitHub Actions).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
} else if (System.getenv("ANDROID_KEYSTORE_FILE")) {
    keystoreProps["storeFile"] = System.getenv("ANDROID_KEYSTORE_FILE")
    keystoreProps["storePassword"] = System.getenv("ANDROID_STORE_PASSWORD") ?: ""
    keystoreProps["keyAlias"] = System.getenv("ANDROID_KEY_ALIAS") ?: ""
    keystoreProps["keyPassword"] = System.getenv("ANDROID_KEY_PASSWORD") ?: ""
}
def hasSigningConfig = ["storeFile", "storePassword", "keyAlias", "keyPassword"].every {
    keystoreProps[it] instanceof String && !keystoreProps[it].trim().isEmpty()
}

android {
    namespace "org.ecoleos.app"
    compileSdk 37

    defaultConfig {
        applicationId "org.ecoleos.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        // Origine HTTPS du serveur École OS. Ce n'est pas un secret : c'est l'adresse publique
        // du déploiement. Elle est injectée au build pour pouvoir changer d'instance sans
        // toucher au code Java :
        //   ./gradlew assembleRelease -PecoleosServerOrigin=https://mon-ecole.vercel.app
        def configuredOrigin = String.valueOf(
            project.findProperty("ecoleosServerOrigin") ?: "https://ecole-os.vercel.app"
        ).trim()
        buildConfigField "String", "SERVER_ORIGIN", '"' + configuredOrigin.replace('"', '\\"') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        if (hasSigningConfig) {
            release {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
            // Ne jamais signer une variante release avec la clé debug.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Échouer avant toute compilation release sans clé (au lieu de produire un APK non signé).
tasks.register("validateReleaseSigning") {
    doLast {
        if (!hasSigningConfig || !rootProject.file(keystoreProps["storeFile"]).isFile()) {
            throw new GradleException(
                "Signature release absente ou incomplète. Configurez android/keystore.properties " +
                "ou les variables ANDROID_KEYSTORE_FILE, ANDROID_STORE_PASSWORD, " +
                "ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD (voir RELEASE_SIGNING.md)."
            )
        }
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn("validateReleaseSigning")
}

def findWebDist() {
    def candidates = [
        rootProject.file("../dist"),
        rootProject.file("../../EcoleOS/dist"),
        rootProject.file("../../EcoleOS_web_security_fixes/dist"),
        rootProject.file("../EcoleOS/dist"),
        rootProject.file("../EcoleOS_web_security_fixes/dist")
    ]
    for (def candidate : candidates) {
        if (new File(candidate, "index.html").isFile()) {
            return candidate
        }
    }
    return rootProject.file("../dist")
}

def webDist = findWebDist()
def webAssets = file("src/main/assets/www")

tasks.register("syncWebAssets", Sync) {
    from(webDist)
    into(webAssets)
    includeEmptyDirs = false
    doFirst {
        if (!new File(webDist, "index.html").isFile()) {
            // Un avertissement silencieux laissait passer un APK sans interface du tout.
            throw new GradleException(
                "Interface web introuvable dans " + webDist + ".\n" +
                "Construisez d'abord le bundle Android :  npm run build:android\n" +
                "(pas `npm run build` : ce mode embarque le service worker PWA et Vercel " +
                "Analytics, qui n'ont rien à faire dans un WebView.)"
            )
        }
        // Garde-fou : le bundle Android ne doit contenir ni service worker ni workbox.
        def strays = ["sw.js", "workbox-abeb32eb.js"].findAll { new File(webDist, it).isFile() }
        def pwaChunks = new File(webDist, "assets").isDirectory()
            ? new File(webDist, "assets").list().findAll { it.startsWith("virtual_pwa-register") }
            : []
        if (!strays.isEmpty() || !pwaChunks.isEmpty()) {
            throw new GradleException(
                "Le bundle dans " + webDist + " est un build WEB (" + (strays + pwaChunks).join(", ") + ").\n" +
                "Relancez  npm run build:android  pour produire le bundle destiné au WebView."
            )
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}
